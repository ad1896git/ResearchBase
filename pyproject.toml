[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "researchbase"
version = "0.1.0"
description = "ResearchBase scientific provenance foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.141,<0.142",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.27,<0.28",
]

[project.scripts]
researchbase = "researchbase.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pyright>=1.1,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/researchbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
