services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: researchbase
      POSTGRES_USER: researchbase
      POSTGRES_PASSWORD: researchbase
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchbase -d researchbase"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - researchbase-postgres:/var/lib/postgresql

volumes:
  researchbase-postgres:
