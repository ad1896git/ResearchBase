name: CI

on:
  # Protected main requires all seven real checks, including documentation-only PRs.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      timing-sha256: ${{ steps.timings.outputs.sha256 }}
      timing-artifact-id: ${{ steps.publish-timings.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Freeze one trusted timing profile for all shards
        id: timings
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: uv run python scripts/ci_timing_profile.py --base "$TIMING_BASE" --output /tmp/ci-shard-profile
      - uses: actions/upload-artifact@v4
        id: publish-timings
        with:
          name: ci-shard-profile-${{ github.run_attempt }}
          path: /tmp/ci-shard-profile/
          if-no-files-found: error

  checks:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: researchbase_ci_${{ matrix.shard }}
          POSTGRES_USER: researchbase
          POSTGRES_PASSWORD: researchbase
          # SERIALIZABLE fixture writers retain predicate locks across overlapping work.
          # UNVERIFIED mitigation, pending Linux CI: avoid possible LLVM JIT
          # overhead in trigger-heavy tests. The 57014 timeout is confirmed;
          # JIT attribution has not been measured on the local non-JIT server.
          POSTGRES_INITDB_ARGS: "--set=max_locks_per_transaction=256 --set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchbase -d researchbase_ci_${{ matrix.shard }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://researchbase:researchbase@localhost:5432/researchbase_ci_${{ matrix.shard }}
      RB_TEST_ADMIN_URL: postgresql+psycopg://researchbase:researchbase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pull_request runs check out a detached merge commit; branch-bound scripts
      # (scripts/researchbase_host_pr2_04_verification.sh --dry-run) need a named branch.
      - name: Name the checked-out commit for branch-bound scripts
        if: github.event_name == 'pull_request'
        run: git switch -c "ci-pr-${{ github.run_id }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: uv sync --locked --group dev
      - run: uv run alembic upgrade head
      - run: test "$(uv run alembic current | tail -n 1)" = "0085_literature_self_verification (head)"
      - name: Download this run's frozen timing profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.static.outputs.timing-artifact-id }}
          merge-multiple: true
          path: /tmp/ci-shard-profile
      - name: Verify identical profile bytes across all six shards
        env:
          TIMING_SHA256: ${{ needs.static.outputs.timing-sha256 }}
        run: uv run python scripts/ci_timing_profile.py --verify /tmp/ci-shard-profile/profile.json --sha256 "$TIMING_SHA256"
      - name: Run deterministic pytest file shard
        shell: bash
        run: |
          uv run python scripts/ci_pytest_files.py --index ${{ matrix.shard }} --count 6 --durations /tmp/ci-shard-profile/profile.json > /tmp/pytest-files.txt
          mapfile -t test_files < /tmp/pytest-files.txt
          uv run pytest --junitxml=/tmp/pytest-results.xml "${test_files[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-timings-${{ matrix.shard }}
          path: |
            /tmp/pytest-results.xml
            /tmp/pytest-files.txt
